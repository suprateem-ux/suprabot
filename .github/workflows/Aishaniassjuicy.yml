name: Download and Unzip Engine

on:
  workflow_dispatch:
  push:

permissions:
  contents: write   # needed to push commits

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download zip
        run: |
          mkdir -p engines
          curl -L -o engine.zip "https://github.com/suprateem-ux/suprabot/raw/main/engines/fairy-stockfish-linux-x86-64-bmi2%204.zip"

      - name: Unzip
        run: |
          unzip -o engine.zip -d engines
          rm engine.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add engines
          git commit -m "Add unzipped engine files" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
