name: Download Fairy Stockfish Artifact

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create engines folder
        run: mkdir -p engines

      - name: Get artifact download URL
        id: geturl
        run: |
          URL=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish/actions/artifacts/8005837179 \
            | jq -r '.archive_download_url')

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download artifact properly
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -o artifact.zip \
            "${{ steps.geturl.outputs.url }}"

      - name: Verify file
        run: file artifact.zip

      - name: Extract
        run: unzip artifact.zip -d engines

      - name: Show result
        run: ls -R engines
