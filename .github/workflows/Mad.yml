name: Overwrite Repo

on:
  push:
    branches:
      - main   # run when main gets updated
  workflow_dispatch: {}   # allows manual trigger

jobs:
  overwrite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clear the repo
      run: |
        git rm -r * || true
        rm -rf .[!.]* || true

    - name: Copy new content
      # replace this with whatever produces the files you want to overwrite with.
      # Example: if you generate files or copy from another location
      run: |
        echo "Add your file copy or build steps here"
        # e.g., cp -R ../build/* .

    - name: Commit overwrite
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Overwrite repo with generated content" || echo "No changes to commit"

    - name: Force push to main
      run: |
        git push origin HEAD:main --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
