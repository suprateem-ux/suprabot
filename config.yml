online_moves:
  opening_explorer:
    enabled: true
    priority: 500
    player: kingznight
    only_without_book: false
    use_for_variants: true
    allow_repetitions: false              # Whether the cloud can create repetitions on the board. Can lead to unintentional draws.     
    min_time: 20
    timeout: 5
    min_games: 5
    only_with_wins: false
    selection: "performance"
    anti: false
    # max_depth: 20

  lichess_cloud:
    enabled: true
    priority: 200
    only_without_book: false
    min_eval_depth: 35
    min_time: 10
    timeout: 3
    use_for_variants: false
    allow_repetitions: true              # Whether the cloud can create repetitions on the board. Can lead to unintentional draws.
    trust_eval: true
    # max_depth: 30
    min_depth: 13

  chessdb:
    enabled: true
    priority: 255
    only_without_book: false
    allow_repetitions: true             # Whether the chessdb can create repetitions on the board. Can lead to unintentional draws.
    trust_eval: true                     # Whether the chessdb eval should be trusted for draw offers and resignations.
    min_time: 10                       
    timeout: 3             
    best_move: false       
            
  online_egtb:
    enabled: true
    min_time: 20
    timeout: 3

